<!DOCTYPE html>
<!-- index.html: the page itself. Browsers always open "index.html" first. -->
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Informal Capital</title>
  <meta name="description" content="Informal Capital is a private investment group that deploys capital across interesting endeavours in technology.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <nav>
      <span class="logo">Informal</span>
      <a href="#portfolio">Portfolio</a>
      <a href="#contact">Contact</a>
    </nav>
    <h1>Informal Capital</h1>
    <p class="tagline">A private investment group that deploys capital across interesting endeavours in technology.</p>
    <a class="button" href="mailto:contact@informal.com.au">Get in touch</a>
  </header>

  <main>
    <section id="portfolio">
      <h2>Portfolio</h2>
      <!-- Cards are built from portfolio.json. To add a company, add a line there. -->
      <div class="cards" id="portfolio-list"></div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p><a href="mailto:contact@informal.com.au">contact@informal.com.au</a></p>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Informal Capital</p>
  </footer>
  <script>
    // Reads portfolio.json and builds one card per company.
    // Each link opens in a new tab (target="_blank").
    fetch('portfolio.json')
      .then(res => res.json())
      .then(companies => {
        const list = document.getElementById('portfolio-list');
        companies.forEach(c => {
          const a = document.createElement('a');
          a.className = 'card';
          a.href = c.url;
          a.target = '_blank';
          a.rel = 'noopener';
          const h3 = document.createElement('h3');
          h3.textContent = c.name;
          a.appendChild(h3);
          list.appendChild(a);
        });
      })
      .catch(() => {
        document.getElementById('portfolio-list').textContent = 'Portfolio could not be loaded.';
      });
  </script>
</body>
</html>
